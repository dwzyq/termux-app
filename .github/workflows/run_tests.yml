name: Unit tests

on:
  push:
    branches:
      - master
      - android-10
  pull_request:
    branches:
      - master
      - android-10

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    - name: Set up JDK 11
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '11'
    - name: Execute tests
      run: |
        ./gradlew test
